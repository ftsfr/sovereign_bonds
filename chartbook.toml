[project]
name = "JP Morgan EMBI Sovereign Bond Returns"
description = "Emerging market sovereign bond returns from JP Morgan EMBI indices"
contributors = [
    "Jeremy Bejarano",
]
repo_url = "https://github.com/ftsfr/sovereign_bonds"
copyright = "2025"
os_compatibility = [
    "Windows/Linux/MacOS (requires Bloomberg)",
]

[notebooks.summary_embi_returns]
name = "summary_embi_returns"
description = "Summary statistics and visualization of EMBI returns"
path = "_output/summary_embi_returns.ipynb"
publishable = true

[dataframes.ftsfr_embi_returns]
name = "ftsfr_embi_returns"
description = "Daily returns for JP Morgan EMBI emerging market bond indices"
sources = [
    "Bloomberg JP Morgan EMBI",
]
providers = [
    "Bloomberg",
    "JP Morgan",
]
contact_required = [
    "no",
]
pre_approved = [
    "No",
]
provider_links = [
    "https://bloomberg.com",
    "https://www.jpmorgan.com",
]
tags = [
    "sovereign bonds",
    "emerging markets",
    "EMBI",
    "fixed income",
    "returns",
]
access_types = [
    "Bloomberg Terminal",
]
license = "Bloomberg"
restrictions = "No"
pull_method = "Pulled from Bloomberg via xbbg"
path = "./_data/ftsfr_embi_returns.parquet"
date_col = "ds"
docs = """
## JP Morgan EMBI Returns

Daily returns for emerging market sovereign bond indices.

### Columns

| Column | Description |
|--------|-------------|
| unique_id | Index identifier (e.g., EMBI_Global, EMBI_Brazil) |
| ds | Date |
| y | Daily return (percentage) |

### Methodology

Returns are calculated from total return index levels:

$$
r_t = (P_t / P_{t-1} - 1) \\times 100
$$

### Aggregate Indices

- EMBI_Global: JP Morgan EMBI Global Total Return
- EMBI_Global_Diversified: JP Morgan EMBI Global Diversified
- GBI_EM_Composite: Local currency EM bonds
- CEMBI_Corporate: EM corporate bonds

### Country Indices

Brazil, Mexico, Russia, Turkey, South Africa, Indonesia, Colombia, China

### Data Source

Bloomberg JP Morgan EMBI index data
"""

[charts.embi_cumulative_returns]
name = "EMBI Sovereign Bond Cumulative Returns"
description = "Cumulative returns showing growth of $1 invested in emerging market sovereign bonds"
dataframe = "ftsfr_embi_returns"
path = "./_output/embi_cumulative_returns.html"
tags = [
    "sovereign bonds",
    "emerging markets",
    "EMBI",
    "cumulative returns",
]
docs = """
## EMBI Sovereign Bond Cumulative Returns

Cumulative returns showing growth of $1 invested in JP Morgan EMBI emerging market bond indices.

### Indices

- EMBI_Global: JP Morgan EMBI Global Total Return
- EMBI_Global_Diversified: JP Morgan EMBI Global Diversified
- GBI_EM_Composite: Local currency EM bonds
- CEMBI_Corporate: EM corporate bonds
- Country indices: Brazil, Mexico, Russia, Turkey, South Africa, Indonesia, Colombia, China

### Calculation

Cumulative return = Product of (1 + daily return) over time

### Data Source

Bloomberg JP Morgan EMBI index data
"""
